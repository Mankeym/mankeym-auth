services:
    auth-api:
        healthcheck:
            test: [ "CMD", "curl", "-f", "http://localhost:8080/health/live" ]
            interval: 30s
            timeout: 3s
            retries: 3
        build:
            context: .
            dockerfile: Dockerfile
        container_name: authservice-api
        ports:
            - "5000:8080"
        env_file:
            - .env
        environment:
            - ASPNETCORE_ENVIRONMENT=Development
            - JwtSettings__SecretKey=${JWT_SECRET_KEY}
            - ConnectionStrings__DefaultConnection=Host=postgres;Database=authdb;Username=postgres;Password=${POSTGRES_PASSWORD}
        depends_on:
            - postgres
            - redis

    postgres:
        image: postgres:16-alpine
        container_name: authservice-postgres
        environment:
            - POSTGRES_USER=postgres
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_DB=authdb
        ports:
            - "5435:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
    redis:
        image: redis:latest
        ports:
            - "6390:6379"
        restart: always

volumes:
    postgres_data:
