groups:
  - name: auth-service
    rules:
      - alert: RefreshTokenReuseDetected
        expr: increase(auth_refresh_token_reuse_total[5m]) > 0
        for: 0m
        labels: { severity: critical }
        annotations: { summary: "Refresh token reuse detected" }
      - alert: AuthApiHigh5xxRate
        expr: sum(rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[10m])) / sum(rate(http_server_request_duration_seconds_count[10m])) > 0.02
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "Auth API 5xx rate exceeds 2%" }
      - alert: OutboxMessagesFailed
        expr: increase(auth_outbox_delivery_failures_total[15m]) > 0
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "Outbox deliveries are failing" }
